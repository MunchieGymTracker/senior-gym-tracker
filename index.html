<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b59">
<title>Senior Gym 2026 – Custom Workout Tracker</title>
<style>
:root{--navy:#063b59;--blue:#1f6f8b;--green:#4caf62;--bg:#f4f7f9;--card:#fff;--line:#d9e1e6;--text:#17202a;--muted:#68737d;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,#063b59,#075273);color:#fff;padding:16px 15px calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{font-size:20px;margin:0;text-align:center}.head small{display:block;text-align:center;opacity:.9;margin-top:2px}.icon{background:none;border:0;color:white;font-size:25px}
main{max-width:900px;margin:auto;padding:14px 14px 100px}
.program{background:linear-gradient(135deg,#4caf62,#3e9f5a);color:white;border-radius:16px;padding:15px;text-align:center;margin-bottom:12px}.program strong{font-size:18px;display:block}.program span{font-size:13px}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;color:#33404a;font-weight:700}.nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.weeks{display:grid;grid-template-columns:repeat(6,minmax(80px,1fr));gap:6px;overflow:auto;margin-bottom:12px}.week{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;font-weight:750;color:#34404b}.week small{display:block;font-weight:400;font-size:10px;margin-top:3px}.week.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid #e7ecef;border-radius:15px;padding:13px;margin:10px 0;box-shadow:0 2px 9px #0000000a}.sectionTitle{display:flex;align-items:center;justify-content:space-between;background:#d9edf6;border-radius:9px;padding:9px 11px;margin-bottom:8px;font-weight:800;color:#17445b}.sectionTitle button{border:0;background:transparent;color:#17445b;font-size:17px}
.exercise{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fff}.row{display:flex;align-items:center;gap:8px}.code{background:var(--navy);color:#fff;border-radius:6px;padding:6px 8px;font-weight:800;min-width:35px;text-align:center}.ename{font-weight:800;flex:1}.editbtn{border:0;background:#edf3f6;border-radius:8px;padding:7px}.rx{font-size:13px;color:var(--muted);margin:7px 0 9px 43px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}.set{font-size:12px;color:#58636d;display:flex;align-items:center;gap:4px}.set input{width:21px;height:21px;accent-color:var(--green)}
.note{background:#edf6fc;border:1px solid #b9d9ec;border-radius:12px;padding:11px;margin:12px 0;font-size:13px}
.progress{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:12px}.phead{display:flex;justify-content:space-between;font-weight:800}.bar{height:11px;background:#e1e6ea;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;width:0;background:var(--green)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:10px 12px;font-weight:750;flex:1}.primary{background:var(--navy);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}.panel h2{font-size:17px;margin:0 0 10px}.setting{border-top:1px solid var(--line);padding:12px 0}.setting:first-child{border-top:0}.setting label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.setting input,.setting textarea,.setting select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{border-color:#efc0bd;color:var(--danger)}.add{border:1px dashed #8da2ad;background:#f9fbfc;width:100%;border-radius:10px;padding:10px;color:var(--navy);font-weight:750;margin-top:7px}
.hidden{display:none}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{background:#fff;border-radius:18px 18px 0 0;padding:17px;width:100%;max-width:700px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#eee;border-radius:50%;width:35px;height:35px}.modal .field{margin:9px 0}.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:60;font-size:13px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;display:flex;justify-content:center;gap:0;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#7a848d;font-size:10px;min-width:22%;padding:2px}.tab span{display:block;font-size:21px}.tab.active{color:var(--navy);font-weight:800}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}main{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header><div class="head"><button class="icon" onclick="showTab('settings')">☰</button><div><h1 id="appTitle">Senior Gym 2026</h1><small id="appSub">Strength &amp; Size Programme</small></div><button class="icon" onclick="showTab('progress')">◷</button></div></header>
<main>
<div class="program"><strong id="programTitle"></strong><span id="programDates"></span></div>
<div class="nav" id="programNav"></div>
<section id="screen"></section>
</main>
<footer>
<button class="tab active" id="tWorkouts" onclick="showTab('workouts')"><span>🏋️</span>Workouts</button>
<button class="tab" id="tProgress" onclick="showTab('progress')"><span>📈</span>Progress</button>
<button class="tab" id="tNotes" onclick="showTab('notes')"><span>📝</span>Notes</button>
<button class="tab" id="tSettings" onclick="showTab('settings')"><span>⚙️</span>Customise</button>
</footer>
<div class="modal hidden" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const defaultData={
appTitle:"Senior Gym 2026",appSub:"Strength & Size Programme",
weeks:[["Week 1","20 Apr - 26 Apr"],["Week 2","27 Apr - 3 May"],["Week 3","4 May - 10 May"],["Week 4","11 May - 17 May"],["Week 5","18 May - 24 May"],["Week 6","25 May - 31 May"]],
programs:[
{name:"Full Body Strength & Size",note:"Change to 8 reps on C1 & C2 if strength is priority over size.",sections:[
{name:"Plyos/Power",items:[["A1","Drop Jump",3,"3","BW"],["A2","Hex Bar Jump",3,"3","Hex Bar"]]},
{name:"Strength",items:[["B1","BB Bench",3,"5",""],["B2","Bulgarian Split Squat",3,"5 e/l",""],["C1","Seal Row",3,"12",""],["C2","BB RDL",3,"6",""],["C3","Seated DB Shoulder Press",3,"12",""]]}]},
{name:"Upper Body Strength & Size",note:"",sections:[
{name:"Power",items:[["A1","Chest Throw",3,"3",""],["A2","Rotational Wall Throw",3,"3",""]]},
{name:"Strength",items:[["B1","BB Bench",3,"5",""],["B2","Chin-ups",3,"5",""],["C1","Seal Row",3,"12",""],["C2","Seated DB Shoulder Press",3,"12",""],["C3","DB Curls",3,"12",""]]},
{name:"Off-Feet Conditioning",items:[["A1","Bike/Assault Bike/Rower",15,"30s hard / 30s slow","15 min total"]]}]},
{name:"Full Body Power & Strength",note:"",sections:[
{name:"Plyos/Power",items:[["A1","Chest Throw",3,"3",""],["A2","Hex Bar Jump",3,"3","Hex Bar"],["B1","Drop Jump",3,"3","BW"],["B2","Rotational Wall Throw",3,"3 e/s",""]]},
{name:"Strength",items:[["C1","BB Bench",3,"5",""],["C2","Concentric Quarter Squat",3,"3",""],["C3","Chin-ups",3,"5",""]]}]}
]};

let data=JSON.parse(localStorage.getItem("sg_custom_data")||"null")||defaultData;
let program=Number(localStorage.getItem("sg_program")||0),week=Number(localStorage.getItem("sg_week")||0),tab="workouts";

function saveData(){localStorage.setItem("sg_custom_data",JSON.stringify(data))}
function dkey(p,w,s,i,k){return `sg_${p}_${w}_${s}_${i}_${k}`}
function showTab(t){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("t"+t[0].toUpperCase()+t.slice(1)).classList.add("active");render()}
function render(){
document.getElementById("appTitle").textContent=data.appTitle;document.getElementById("appSub").textContent=data.appSub;
document.getElementById("programTitle").textContent=data.programs[program].name;
document.getElementById("programDates").textContent=data.weeks[0][1]+" to "+data.weeks[data.weeks.length-1][1];
document.getElementById("programNav").innerHTML=data.programs.map((p,i)=>`<button class="${i===program?'active':''}" onclick="selectProgram(${i})">${p.name}</button>`).join("");
if(tab==="workouts")renderWorkout(); if(tab==="progress")renderProgress(); if(tab==="notes")renderNotes(); if(tab==="settings")renderSettings();
}
function selectProgram(i){program=i;localStorage.setItem("sg_program",i);render()}
function renderWorkout(){
let p=data.programs[program],html=`<div class="weeks">${data.weeks.map((w,i)=>`<button class="week ${i===week?'active':''}" onclick="selectWeek(${i})">${w[0]}<small>${w[1]}</small></button>`).join("")}</div>`;
p.sections.forEach((s,si)=>{html+=`<div class="card"><div class="sectionTitle"><span>${s.name}</span><button onclick="editSection(${si})">✎</button></div>`;
s.items.forEach((e,ei)=>{let checks=JSON.parse(localStorage.getItem(dkey(program,week,si,ei,"checks"))||"[]");let wt=localStorage.getItem(dkey(program,week,si,ei,"weight"))||"";let rp=localStorage.getItem(dkey(program,week,si,ei,"reps"))||e[3];
html+=`<div class="exercise"><div class="row"><span class="code">${e[0]}</span><span class="ename">${e[1]}</span><button class="editbtn" onclick="editExercise(${si},${ei})">✎</button></div><div class="rx">${e[2]} sets × ${e[3]}${e[4]?` · ${e[4]}`:""}</div><div class="grid"><div class="field"><label>WEIGHT / LOAD</label><input inputmode="decimal" value="${wt}" placeholder="e.g. 60kg" onchange="setVal(${si},${ei},'weight',this.value)"></div><div class="field"><label>REPS / RESULT</label><input value="${rp}" onchange="setVal(${si},${ei},'reps',this.value)"></div></div><div class="sets">${Array.from({length:Math.min(3,Number(e[2])||1)},(_,s)=>`<label class="set">Set ${s+1}<input type="checkbox" ${checks[s]?'checked':''} onchange="check(${si},${ei},${s},this.checked)"></label>`).join("")}</div></div>`});
html+=`<button class="add" onclick="addExercise(${si})">＋ Add exercise to ${s.name}</button></div>`});
html+=`<div class="note">${p.note||"Add your own note in Customise."}</div>${progressCard()}`;document.getElementById("screen").innerHTML=html;updateProgress()
}
function progressCard(){return `<div class="progress"><div class="phead"><span>${data.weeks[week][0]} Progress</span><span id="pct">0%</span></div><div class="bar"><i id="bar"></i></div><div class="actions"><button class="btn primary" onclick="toast('Progress saved ✓')">Save Progress</button><button class="btn" onclick="resetWeek()">Reset Week</button></div></div>`}
function selectWeek(i){week=i;localStorage.setItem("sg_week",i);render();window.scrollTo({top:0,behavior:"smooth"})}
function setVal(s,i,k,v){localStorage.setItem(dkey(program,week,s,i,k),v);toast("Saved ✓")}
function check(s,i,x,v){let c=JSON.parse(localStorage.getItem(dkey(program,week,s,i,"checks"))||"[]");c[x]=v;localStorage.setItem(dkey(program,week,s,i,"checks"),JSON.stringify(c));updateProgress()}
function updateProgress(){let p=data.programs[program],done=0,total=0;p.sections.forEach((s,si)=>s.items.forEach((e,ei)=>{let n=Math.min(3,Number(e[2])||1);total+=n;let c=JSON.parse(localStorage.getItem(dkey(program,week,si,ei,"checks"))||"[]");done+=c.slice(0,n).filter(Boolean).length}));let pct=total?Math.round(done/total*100):0;let x=document.getElementById("pct"),b=document.getElementById("bar");if(x)x.textContent=pct+"%";if(b)b.style.width=pct+"%"}
function resetWeek(){if(confirm("Reset all tracked values for "+data.weeks[week][0]+" in this workout?")){data.programs[program].sections.forEach((s,si)=>s.items.forEach((e,ei)=>["weight","reps","checks"].forEach(k=>localStorage.removeItem(dkey(program,week,si,ei,k))));render();toast("Week reset")}}
function renderProgress(){let html=`<div class="panel"><h2>Progress overview</h2>`;data.programs.forEach((p,pi)=>{html+=`<div class="setting"><b>${p.name}</b>`;data.weeks.forEach((w,wi)=>{let done=0,total=0;p.sections.forEach((s,si)=>s.items.forEach((e,ei)=>{let n=Math.min(3,Number(e[2])||1);total+=n;let c=JSON.parse(localStorage.getItem(dkey(pi,wi,si,ei,"checks"))||"[]");done+=c.slice(0,n).filter(Boolean).length}));html+=`<div style="margin-top:7px"><small>${w[0]} — ${total?Math.round(done/total*100):0}%</small><div class="bar"><i style="width:${total?Math.round(done/total*100):0}%"></i></div></div>`});html+=`</div>`});html+=`</div>`;document.getElementById("screen").innerHTML=html}
function renderNotes(){let p=data.programs[program];document.getElementById("screen").innerHTML=`<div class="panel"><h2>Notes — ${p.name}</h2><textarea id="mainNote" rows="9" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px" placeholder="Write anything here...">${localStorage.getItem("sg_note_"+program)||p.note||""}</textarea><button class="btn primary" style="width:100%;margin-top:9px" onclick="localStorage.setItem('sg_note_'+program,document.getElementById('mainNote').value);toast('Note saved ✓')">Save Note</button></div>`}
function renderSettings(){
let p=data.programs[program];let html=`<div class="panel"><h2>Customise programme</h2><div class="setting"><label>App title</label><input id="setTitle" value="${data.appTitle}"></div><div class="setting"><label>Subtitle</label><input id="setSub" value="${data.appSub}"></div><div class="setting"><label>Workout name</label><input id="setPName" value="${p.name}"></div><div class="setting"><label>Workout note</label><textarea id="setNote" rows="3">${p.note||""}</textarea></div><button class="btn primary" onclick="saveSettings()">Save Changes</button></div>`;
html+=`<div class="panel"><h2>Weeks</h2>`;data.weeks.forEach((w,i)=>{html+=`<div class="setting twocol"><div><label>Week name</label><input id="wn${i}" value="${w[0]}"></div><div><label>Date range</label><input id="wd${i}" value="${w[1]}"></div></div>`});html+=`</div>`;
html+=`<div class="panel"><h2>Workout sections</h2>`;p.sections.forEach((s,i)=>html+=`<div class="setting"><b>${s.name}</b><button class="btn" style="float:right;padding:6px 9px" onclick="editSection(${i})">Edit</button><button class="btn danger" style="float:right;padding:6px 9px;margin-right:5px" onclick="deleteSection(${i})">Delete</button></div>`);html+=`<button class="add" onclick="addSection()">＋ Add section</button></div>`;
html+=`<div class="panel"><h2>Workout management</h2><button class="add" onclick="addProgram()">＋ Add another workout</button><button class="add danger" onclick="deleteProgram()">Delete current workout</button><p style="font-size:12px;color:var(--muted)">Everything is stored locally on this phone. You can change exercise names, codes, sets, reps, loads, sections, notes, weeks and add/remove whole workouts.</p></div>`;
document.getElementById("screen").innerHTML=html}
function saveSettings(){data.appTitle=document.getElementById("setTitle").value;data.appSub=document.getElementById("setSub").value;data.programs[program].name=document.getElementById("setPName").value;data.programs[program].note=document.getElementById("setNote").value;data.weeks.forEach((w,i)=>{w[0]=document.getElementById("wn"+i).value;w[1]=document.getElementById("wd"+i).value});saveData();render();toast("Customisation saved ✓")}
function editSection(si){let s=data.programs[program].sections[si];openModal(`<div class="modalhead"><h2>Edit section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Section name</label><input id="mName" value="${s.name}"></div><button class="btn primary" style="width:100%" onclick="saveSection(${si})">Save</button>`)}
function saveSection(si){data.programs[program].sections[si].name=document.getElementById("mName").value;saveData();closeModal();render();toast("Section updated")}
function addSection(){openModal(`<div class="modalhead"><h2>Add section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Section name</label><input id="mName" placeholder="e.g. Conditioning"></div><button class="btn primary" style="width:100%" onclick="doAddSection()">Add Section</button>`)}
function doAddSection(){data.programs[program].sections.push({name:document.getElementById("mName").value||"New Section",items:[]});saveData();closeModal();render()}
function deleteSection(si){if(confirm("Delete this section and its exercises?")){data.programs[program].sections.splice(si,1);saveData();render()}}
function editExercise(si,ei){let e=data.programs[program].sections[si].items[ei];openModal(`<div class="modalhead"><h2>Edit exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="ec" value="${e[0]}"></div><div class="field"><label>Exercise name</label><input id="en" value="${e[1]}"></div><div class="twocol"><div class="field"><label>Sets</label><input id="es" value="${e[2]}"></div><div class="field"><label>Reps / prescription</label><input id="er" value="${e[3]}"></div></div><div class="field"><label>Equipment / extra instruction</label><input id="ex" value="${e[4]||""}"></div><button class="btn primary" style="width:100%" onclick="saveExercise(${si},${ei})">Save Exercise</button><button class="btn danger" style="width:100%;margin-top:7px" onclick="removeExercise(${si},${ei})">Delete Exercise</button>`)}
function saveExercise(si,ei){let a=data.programs[program].sections[si].items[ei];a[0]=document.getElementById("ec").value;a[1]=document.getElementById("en").value;a[2]=document.getElementById("es").value;a[3]=document.getElementById("er").value;a[4]=document.getElementById("ex").value;saveData();closeModal();render();toast("Exercise updated")}
function removeExercise(si,ei){if(confirm("Delete this exercise?")){data.programs[program].sections[si].items.splice(ei,1);saveData();closeModal();render()}}
function addExercise(si){openModal(`<div class="modalhead"><h2>Add exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="ec" value="NEW"></div><div class="field"><label>Exercise name</label><input id="en" placeholder="Exercise"></div><div class="twocol"><div class="field"><label>Sets</label><input id="es" value="3"></div><div class="field"><label>Reps / prescription</label><input id="er" value="8"></div></div><div class="field"><label>Equipment / extra instruction</label><input id="ex"></div><button class="btn primary" style="width:100%" onclick="doAddExercise(${si})">Add Exercise</button>`)}
function doAddExercise(si){data.programs[program].sections[si].items.push([document.getElementById("ec").value,document.getElementById("en").value||"New Exercise",document.getElementById("es").value||3,document.getElementById("er").value||8,document.getElementById("ex").value]);saveData();closeModal();render()}
function addProgram(){openModal(`<div class="modalhead"><h2>Add workout</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Workout name</label><input id="pn" placeholder="e.g. Lower Body"></div><button class="btn primary" style="width:100%" onclick="doAddProgram()">Add Workout</button>`)}
function doAddProgram(){data.programs.push({name:document.getElementById("pn").value||"New Workout",note:"",sections:[{name:"Strength",items:[]}]});program=data.programs.length-1;saveData();closeModal();render()}
function deleteProgram(){if(data.programs.length<=1)return alert("Keep at least one workout.");if(confirm("Delete this workout?")){data.programs.splice(program,1);program=Math.max(0,program-1);saveData();render()}}
function openModal(c){document.getElementById("modalbox").innerHTML=c;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1200)}
render();
</script>
</body>
</html>
