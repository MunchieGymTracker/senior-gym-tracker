<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063b59">
<title>Munchie Gym Tracker</title>
<style>
:root{--navy:#063b59;--green:#43a45d;--bg:#f4f7f9;--card:#fff;--line:#d9e1e6;--text:#17202a;--muted:#68737d;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#063b59,#075273);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between}.head h1{font-size:20px;margin:0;text-align:center}.head small{display:block;text-align:center;opacity:.9}.icon{border:0;background:none;color:#fff;font-size:24px}
main{max-width:900px;margin:auto;padding:14px 14px 100px}.program{background:linear-gradient(135deg,#43a45d,#369350);color:#fff;border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.nav button.active{background:var(--navy);color:#fff}
.weekbar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;margin-bottom:12px}.weekbar>button{height:42px;border:1px solid var(--line);border-radius:10px;background:#f8fafb;font-size:22px;color:var(--navy)}
.weekcentre{text-align:center}.weekcentre b{display:block}.weekcentre span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.today{border:0;background:none;color:#1f6f8b;font-size:12px;font-weight:800;margin-top:4px}
.card,.panel,.progress{background:#fff;border:1px solid #e7ecef;border-radius:15px;padding:13px;margin:10px 0}.sectionTitle{display:flex;justify-content:space-between;align-items:center;background:#d9edf6;border-radius:9px;padding:9px 11px;font-weight:800;color:#17445b;margin-bottom:8px}.sectionTitle button,.edit{border:0;background:#edf3f6;border-radius:8px;padding:7px}
.exercise{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.row{display:flex;gap:8px;align-items:center}.code{background:var(--navy);color:#fff;border-radius:6px;padding:6px 8px;font-weight:800}.ename{font-weight:800;flex:1}.rx{font-size:13px;color:var(--muted);margin:7px 0}.previous{background:#f6fafc;border:1px solid #dbe8ee;border-radius:9px;padding:8px 9px;font-size:12px;color:#47616f;margin-bottom:9px}
.sethead,.setrow{display:grid;grid-template-columns:48px 1fr 1fr 34px;gap:7px;align-items:center}.sethead{font-size:10px;color:var(--muted);font-weight:750;padding-bottom:4px}.setrow{margin:6px 0}.setrow input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 8px;font-size:16px}.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.note{background:#edf6fc;border:1px solid #b9d9ec;border-radius:12px;padding:11px;margin:12px 0;font-size:13px}.phead{display:flex;justify-content:space-between;font-weight:800}.bar{height:11px;background:#e1e6ea;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:var(--green);width:0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:10px 12px;font-weight:750;flex:1}.primary{background:var(--navy);color:#fff}.danger{border-color:#efc0bd;color:var(--danger)}
.add{border:1px dashed #8da2ad;background:#f9fbfc;width:100%;border-radius:10px;padding:10px;color:var(--navy);font-weight:750;margin-top:7px}
.setting{border-top:1px solid var(--line);padding:12px 0}.setting:first-child{border-top:0}.setting label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.setting input,.setting textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.tab{border:0;background:none;color:#7a848d;font-size:10px;min-width:22%}.tab span{display:block;font-size:21px}.tab.active{color:var(--navy);font-weight:800}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end;justify-content:center}.modalbox{background:#fff;border-radius:18px 18px 0 0;padding:17px;width:100%;max-width:700px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:50%;width:35px;height:35px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:60;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat{background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:11px}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.stat b{font-size:18px}
.metricrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.historylink{border:0;background:none;padding:0;color:var(--navy);font-weight:800;text-align:left}
.historytable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.historytable th,.historytable td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}
.historytable th{color:var(--muted);font-size:11px}
.pb{display:inline-block;background:#fff4ce;border:1px solid #efd572;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:800;margin-left:5px}
.good{color:#247a3b;font-weight:800}

</style>
</head>
<body>
<header><div class="head"><button class="icon" onclick="showTab('settings')">☰</button><div><h1 id="appTitle"></h1><small id="appSub"></small></div><button class="icon" onclick="showTab('progress')">◷</button></div></header>
<main>
<div class="program"><strong id="programTitle"></strong><div>Track every set, every week — no end date</div></div>
<div class="nav" id="programNav"></div>
<section id="screen"></section>
</main>
<footer>
<button class="tab active" id="tWorkouts" onclick="showTab('workouts')"><span>🏋️</span>Workouts</button>
<button class="tab" id="tProgress" onclick="showTab('progress')"><span>📈</span>Progress</button>
<button class="tab" id="tNotes" onclick="showTab('notes')"><span>📝</span>Notes</button>
<button class="tab" id="tSettings" onclick="showTab('settings')"><span>⚙️</span>Customise</button>
</footer>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<script>
const defaults={appTitle:"Munchie Gym Tracker",appSub:"Week-by-week training log",programs:[
{name:"Full Body Strength & Size",note:"Change to 8 reps on C1 & C2 if strength is priority over size.",sections:[
{name:"Plyos/Power",items:[["A1","Drop Jump",3,"3","BW"],["A2","Hex Bar Jump",3,"3","Hex Bar"]]},
{name:"Strength",items:[["B1","BB Bench",3,"5",""],["B2","Bulgarian Split Squat",3,"5",""],["C1","Seal Row",3,"12",""],["C2","BB RDL",3,"6",""],["C3","Seated DB Shoulder Press",3,"12",""]]}]},
{name:"Upper Body Strength & Size",note:"",sections:[
{name:"Power",items:[["A1","Chest Throw",3,"3",""],["A2","Rotational Wall Throw",3,"3",""]]},
{name:"Strength",items:[["B1","BB Bench",3,"5",""],["B2","Chin-ups",3,"5",""],["C1","Seal Row",3,"12",""],["C2","Seated DB Shoulder Press",3,"12",""],["C3","DB Curls",3,"12",""]]},
{name:"Off-Feet Conditioning",items:[["A1","Bike / Rower",1,"15","30s hard / 30s slow"]]}]},
{name:"Full Body Power & Strength",note:"",sections:[
{name:"Plyos/Power",items:[["A1","Chest Throw",3,"3",""],["A2","Hex Bar Jump",3,"3","Hex Bar"],["B1","Drop Jump",3,"3","BW"],["B2","Rotational Wall Throw",3,"3",""]]},
{name:"Strength",items:[["C1","BB Bench",3,"5",""],["C2","Concentric Quarter Squat",3,"3",""],["C3","Chin-ups",3,"5",""]]}]}
]};
let data=JSON.parse(localStorage.getItem("mgt_data")||"null")||defaults;
let program=Number(localStorage.getItem("mgt_program")||0),tab="workouts",weekStart=monday(new Date());
function monday(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function label(d){let a=monday(new Date()),diff=Math.round((d-a)/604800000);return diff===0?"This Week":diff===-1?"Last Week":diff===1?"Next Week":"Week of "+fmt(d)}
function rk(p,w,s,i,set,k){return `mgt_${p}_${w}_${s}_${i}_${set}_${k}`}
function saveData(){localStorage.setItem("mgt_data",JSON.stringify(data))}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function showTab(t){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById("t"+t[0].toUpperCase()+t.slice(1)).classList.add("active");render()}
function selectProgram(i){program=i;localStorage.setItem("mgt_program",i);render()}
function shiftWeek(n){weekStart=addDays(weekStart,n*7);render();window.scrollTo({top:0,behavior:"smooth"})}
function goToday(){weekStart=monday(new Date());render()}
function weekbar(){return `<div class="weekbar"><button onclick="shiftWeek(-1)">‹</button><div class="weekcentre"><b>${label(weekStart)}</b><span>${fmt(weekStart)} – ${fmt(addDays(weekStart,6))}</span><button class="today" onclick="goToday()">Jump to this week</button></div><button onclick="shiftWeek(1)">›</button></div>`}
function render(){if(program>=data.programs.length)program=0;document.getElementById("appTitle").textContent=data.appTitle;document.getElementById("appSub").textContent=data.appSub;document.getElementById("programTitle").textContent=data.programs[program].name;document.getElementById("programNav").innerHTML=data.programs.map((p,i)=>`<button class="${i===program?'active':''}" onclick="selectProgram(${i})">${esc(p.name)}</button>`).join("");if(tab==="workouts")workouts();if(tab==="progress")progress();if(tab==="notes")notes();if(tab==="settings")settings()}
function previous(si,ei,e){let w=iso(addDays(weekStart,-7)),a=[];for(let s=0;s<Number(e[2]);s++){let wt=localStorage.getItem(rk(program,w,si,ei,s,"weight")),rp=localStorage.getItem(rk(program,w,si,ei,s,"reps"));if(wt||rp)a.push(`S${s+1}: ${wt||"—"}${wt?"kg":""} × ${rp||"—"}`)}return a.length?`<div class="previous"><b>Last week:</b> ${a.join(" · ")}</div>`:""}
function workouts(){let p=data.programs[program],w=iso(weekStart),h=weekbar();p.sections.forEach((sec,si)=>{h+=`<div class="card"><div class="sectionTitle"><span>${esc(sec.name)}</span><button onclick="editSection(${si})">✎</button></div>`;sec.items.forEach((e,ei)=>{let sets=Math.max(1,Number(e[2])||1);h+=`<div class="exercise"><div class="row"><span class="code">${esc(e[0])}</span><button class="ename historylink" onclick="showExerciseHistory(${si},${ei})">${esc(e[1])}</button><button class="edit" onclick="editExercise(${si},${ei})">✎</button></div><div class="rx">Target: ${sets} sets × ${esc(e[3])}${e[4]?` · ${esc(e[4])}`:""} <span id="sum_${si}_${ei}"></span></div>${previous(si,ei,e)}<div class="sethead"><span>SET</span><span>WEIGHT</span><span>REPS</span><span>DONE</span></div>`;for(let s=0;s<sets;s++){let wt=localStorage.getItem(rk(program,w,si,ei,s,"weight"))||"",rp=localStorage.getItem(rk(program,w,si,ei,s,"reps"))||"",dn=localStorage.getItem(rk(program,w,si,ei,s,"done"))==="1";h+=`<div class="setrow"><b>Set ${s+1}</b><input type="number" step="0.5" inputmode="decimal" placeholder="kg" value="${esc(wt)}" oninput="saveSet(${si},${ei},${s},'weight',this.value)"><input type="number" inputmode="numeric" placeholder="reps" value="${esc(rp)}" oninput="saveSet(${si},${ei},${s},'reps',this.value);autoDone(${si},${ei},${s},this.value)"><input id="d_${si}_${ei}_${s}" type="checkbox" ${dn?'checked':''} onchange="saveSet(${si},${ei},${s},'done',this.checked?'1':'0');updateProgress()"></div>`}h+=`</div>`});h+=`<button class="add" onclick="addExercise(${si})">＋ Add exercise</button></div>`});if(p.note)h+=`<div class="note">${esc(p.note)}</div>`;h+=`<div class="progress"><div class="phead"><span>${label(weekStart)} Progress</span><span id="pct">0%</span></div><div class="bar"><i id="bar"></i></div><div class="actions"><button class="btn primary" onclick="toast('Saved ✓')">Save</button><button class="btn" onclick="resetWeek()">Reset Week</button></div></div>`;document.getElementById("screen").innerHTML=h;
  updateProgress();
  p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>updateExerciseSummary(si,ei)));
}
function saveSet(si,ei,s,k,v){
  localStorage.setItem(rk(program,iso(weekStart),si,ei,s,k),v);
  updateExerciseSummary(si,ei);
}
function autoDone(si,ei,s,v){
  if(String(v).trim()){
    let c=document.getElementById(`d_${si}_${ei}_${s}`);
    if(c&&!c.checked){c.checked=true;saveSet(si,ei,s,"done","1")}
  }
  updateExerciseSummary(si,ei);
  updateProgress();
}
function updateProgress(){let p=data.programs[program],w=iso(weekStart),done=0,total=0;p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>{let sets=Math.max(1,Number(e[2])||1);total+=sets;for(let s=0;s<sets;s++)if(localStorage.getItem(rk(program,w,si,ei,s,"done"))==="1")done++}));let pc=total?Math.round(done/total*100):0;if(document.getElementById("pct"))document.getElementById("pct").textContent=pc+"%";if(document.getElementById("bar"))document.getElementById("bar").style.width=pc+"%"}
function resetWeek(){if(!confirm("Reset this workout for "+label(weekStart)+"?"))return;let pre=`mgt_${program}_${iso(weekStart)}_`;Object.keys(localStorage).forEach(k=>{if(k.startsWith(pre))localStorage.removeItem(k)});render()}
function calcSetStats(pi,w,si,ei){
  let e=data.programs[pi].sections[si].items[ei],sets=Math.max(1,Number(e[2])||1);
  let volume=0,bestWeight=0,bestReps=0,bestE1RM=0,completed=0;
  for(let s=0;s<sets;s++){
    let wt=parseFloat(localStorage.getItem(rk(pi,w,si,ei,s,"weight")))||0;
    let rp=parseFloat(localStorage.getItem(rk(pi,w,si,ei,s,"reps")))||0;
    if(wt>0&&rp>0){
      volume+=wt*rp;
      if(wt>bestWeight){bestWeight=wt;bestReps=rp}
      let e1rm=rp<=12?wt*(1+rp/30):0;
      if(e1rm>bestE1RM)bestE1RM=e1rm;
    }
    if(localStorage.getItem(rk(pi,w,si,ei,s,"done"))==="1")completed++;
  }
  return {volume,bestWeight,bestReps,bestE1RM,completed,sets};
}
function weekVolume(pi,w){
  let total=0,p=data.programs[pi];
  p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>{total+=calcSetStats(pi,w,si,ei).volume}));
  return total;
}
function bestEverForExercise(pi,si,ei){
  let prefix=`mgt_${pi}_`,bestWeight=0,bestE1RM=0,bestVolume=0,bestDate="";
  let weeks=new Set();
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith(prefix)&&k.endsWith("_weight")){
      let parts=k.split("_");
      if(parts.length>=8)weeks.add(parts[2]);
    }
  });
  weeks.forEach(w=>{
    let st=calcSetStats(pi,w,si,ei);
    if(st.bestWeight>bestWeight){bestWeight=st.bestWeight;bestDate=w}
    if(st.bestE1RM>bestE1RM)bestE1RM=st.bestE1RM;
    if(st.volume>bestVolume)bestVolume=st.volume;
  });
  return {bestWeight,bestE1RM,bestVolume,bestDate};
}
function updateExerciseSummary(si,ei){
  let el=document.getElementById(`sum_${si}_${ei}`);
  if(!el)return;
  let st=calcSetStats(program,iso(weekStart),si,ei);
  if(!st.volume&&!st.bestE1RM){el.textContent="";return}
  let parts=[];
  if(st.volume)parts.push(`Volume ${Math.round(st.volume)}kg`);
  if(st.bestE1RM)parts.push(`Est. 1RM ${st.bestE1RM.toFixed(1)}kg`);
  el.innerHTML=" · <span class='good'>"+parts.join(" · ")+"</span>";
}
function showExerciseHistory(si,ei){
  let e=data.programs[program].sections[si].items[ei],rows=[],best=bestEverForExercise(program,si,ei);
  for(let n=0;n<20;n++){
    let d=addDays(monday(new Date()),-7*n),w=iso(d),st=calcSetStats(program,w,si,ei);
    if(!st.volume&&!st.bestWeight&&!st.completed)continue;
    rows.push(`<tr><td>${fmt(d)}</td><td>${st.bestWeight?st.bestWeight+"kg":"—"}</td><td>${st.bestE1RM?st.bestE1RM.toFixed(1)+"kg":"—"}</td><td>${st.volume?Math.round(st.volume)+"kg":"—"}</td></tr>`);
  }
  openModal(`<div class="modalhead"><h2>${esc(e[1])}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="stats">
    <div class="stat"><small>PERSONAL BEST</small><b>${best.bestWeight?best.bestWeight+" kg":"—"}</b></div>
    <div class="stat"><small>BEST EST. 1RM</small><b>${best.bestE1RM?best.bestE1RM.toFixed(1)+" kg":"—"}</b></div>
    <div class="stat"><small>BEST SESSION VOLUME</small><b>${best.bestVolume?Math.round(best.bestVolume)+" kg":"—"}</b></div>
    <div class="stat"><small>HISTORY</small><b>${rows.length} weeks</b></div>
  </div>
  <table class="historytable"><thead><tr><th>Week</th><th>Top weight</th><th>Est. 1RM</th><th>Volume</th></tr></thead><tbody>${rows.join("")||"<tr><td colspan='4'>No history yet.</td></tr>"}</tbody></table>`);
}
function saveBodyweight(){
  let v=document.getElementById("bw").value;
  localStorage.setItem("mgt_bw_"+iso(weekStart),v);
  toast("Body weight saved ✓");
  progress();
}
function saveInjury(){
  localStorage.setItem("mgt_injury_"+iso(weekStart),document.getElementById("inj").value);
  toast("Injury note saved ✓");
}
function progress(){
  let w=iso(weekStart),vol=weekVolume(program,w),bw=localStorage.getItem("mgt_bw_"+w)||"",inj=localStorage.getItem("mgt_injury_"+w)||"";
  let lastVol=weekVolume(program,iso(addDays(weekStart,-7)));
  let delta=lastVol?Math.round((vol-lastVol)/lastVol*100):0;
  let p=data.programs[program],pbs=0;
  p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>{
    let cur=calcSetStats(program,w,si,ei),best=bestEverForExercise(program,si,ei);
    if(cur.bestWeight&&best.bestWeight&&cur.bestWeight>=best.bestWeight)pbs++;
  }));
  let h=weekbar()+`<div class="panel"><h2>Performance dashboard</h2>
    <div class="stats">
      <div class="stat"><small>TRAINING VOLUME</small><b>${Math.round(vol)} kg</b><div>${lastVol?(delta>=0?"+":"")+delta+"% vs last week":"No previous week"}</div></div>
      <div class="stat"><small>PERSONAL BESTS THIS WEEK</small><b>${pbs}</b></div>
      <div class="stat"><small>BODY WEIGHT</small><b>${bw?bw+" kg":"—"}</b></div>
      <div class="stat"><small>WEEK</small><b>${fmt(weekStart)}</b></div>
    </div>
    <div class="setting"><label>Body weight (kg)</label><div class="metricrow"><input id="bw" type="number" step="0.1" inputmode="decimal" value="${esc(bw)}" placeholder="e.g. 78.4"><button class="btn primary" onclick="saveBodyweight()">Save</button></div></div>
    <div class="setting"><label>Injury / soreness notes</label><textarea id="inj" rows="4" placeholder="e.g. Left hamstring tight after training">${esc(inj)}</textarea><button class="btn primary" style="width:100%;margin-top:7px" onclick="saveInjury()">Save injury note</button></div>
  </div>`;
  h+=`<div class="panel"><h2>Recent weeks</h2>`;
  for(let off=0;off>-8;off--){
    let d=addDays(weekStart,off*7),ww=iso(d),done=0,total=0,pp=data.programs[program];
    pp.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>{
      let st=calcSetStats(program,ww,si,ei);total+=st.sets;done+=st.completed;
    }));
    let vv=weekVolume(program,ww),bb=localStorage.getItem("mgt_bw_"+ww)||"";
    h+=`<div class="setting"><b>${label(d)}</b><div>${fmt(d)} – ${fmt(addDays(d,6))} · ${total?Math.round(done/total*100):0}% complete · ${Math.round(vv)}kg volume${bb?" · "+bb+"kg BW":""}</div></div>`;
  }
  h+=`</div><div class="panel"><h2>Exercise history & PBs</h2>`;
  p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>{
    let best=bestEverForExercise(program,si,ei);
    h+=`<div class="setting"><button class="historylink" onclick="showExerciseHistory(${si},${ei})">${esc(e[1])}</button>${best.bestWeight?`<span class="pb">PB ${best.bestWeight}kg</span>`:""}<div style="font-size:12px;color:var(--muted);margin-top:4px">${best.bestE1RM?"Best est. 1RM "+best.bestE1RM.toFixed(1)+"kg · ":""}${best.bestVolume?"Best volume "+Math.round(best.bestVolume)+"kg":""}</div></div>`;
  }));
  h+=`</div>`;
  document.getElementById("screen").innerHTML=h;
}
function notes(){let k="mgt_note_"+program;document.getElementById("screen").innerHTML=weekbar()+`<div class="panel"><h2>Notes</h2><textarea id="n" rows="10" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px">${esc(localStorage.getItem(k)||"")}</textarea><button class="btn primary" style="width:100%;margin-top:8px" onclick="localStorage.setItem('${k}',document.getElementById('n').value);toast('Note saved ✓')">Save Note</button></div>`}
function settings(){let p=data.programs[program],h=`<div class="panel"><h2>Customise</h2><div class="setting"><label>App title</label><input id="a" value="${esc(data.appTitle)}"></div><div class="setting"><label>Subtitle</label><input id="b" value="${esc(data.appSub)}"></div><div class="setting"><label>Workout name</label><input id="c" value="${esc(p.name)}"></div><div class="setting"><label>Workout note</label><textarea id="d" rows="3">${esc(p.note||"")}</textarea></div><button class="btn primary" onclick="saveSettings()">Save changes</button></div><div class="panel"><h2>Sections</h2>`;p.sections.forEach((s,i)=>h+=`<div class="setting"><b>${esc(s.name)}</b><button class="btn" style="float:right;padding:6px 9px" onclick="editSection(${i})">Edit</button></div>`);h+=`<button class="add" onclick="addSection()">＋ Add section</button></div><div class="panel"><h2>Week system</h2><p>There is no 6-week limit. Move through weeks forever with the arrows. Each week stores individual set weight/reps, body weight, injury notes, volume, PBs and estimated 1RM history.</p></div>`;document.getElementById("screen").innerHTML=h}
function saveSettings(){data.appTitle=document.getElementById("a").value||"Munchie Gym Tracker";data.appSub=document.getElementById("b").value||"Week-by-week training log";data.programs[program].name=document.getElementById("c").value||"Workout";data.programs[program].note=document.getElementById("d").value;saveData();render();toast("Saved ✓")}
function openModal(h){document.getElementById("modalbox").innerHTML=h;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function editSection(si){let s=data.programs[program].sections[si];openModal(`<div class="modalhead"><h2>Edit section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="m1" value="${esc(s.name)}"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections[${si}].name=document.getElementById('m1').value;saveData();closeModal();render()">Save</button>`)}
function addSection(){openModal(`<div class="modalhead"><h2>Add section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="m1"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections.push({name:document.getElementById('m1').value||'New Section',items:[]});saveData();closeModal();render()">Add</button>`)}
function editExercise(si,ei){let e=data.programs[program].sections[si].items[ei];openModal(`<div class="modalhead"><h2>Edit exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="e0" value="${esc(e[0])}"></div><div class="field"><label>Name</label><input id="e1" value="${esc(e[1])}"></div><div class="field"><label>Sets</label><input id="e2" type="number" min="1" value="${esc(e[2])}"></div><div class="field"><label>Target reps</label><input id="e3" value="${esc(e[3])}"></div><div class="field"><label>Extra</label><input id="e4" value="${esc(e[4]||"")}"></div><button class="btn primary" style="width:100%" onclick="saveExercise(${si},${ei})">Save</button>`)}
function saveExercise(si,ei){let e=data.programs[program].sections[si].items[ei];e[0]=document.getElementById("e0").value;e[1]=document.getElementById("e1").value;e[2]=Math.max(1,Number(document.getElementById("e2").value)||1);e[3]=document.getElementById("e3").value;e[4]=document.getElementById("e4").value;saveData();closeModal();render()}
function addExercise(si){openModal(`<div class="modalhead"><h2>Add exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="e0" value="NEW"></div><div class="field"><label>Name</label><input id="e1"></div><div class="field"><label>Sets</label><input id="e2" type="number" min="1" value="3"></div><div class="field"><label>Target reps</label><input id="e3" value="8"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections[${si}].items.push([document.getElementById('e0').value,document.getElementById('e1').value||'Exercise',Math.max(1,Number(document.getElementById('e2').value)||1),document.getElementById('e3').value,'']);saveData();closeModal();render()">Add</button>`)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1200)}
render();
</script>
</body>
</html>
