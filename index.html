<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07456a">
<title>Munchie Gym Tracker</title>
<style>
:root{--navy:#063b59;--blue:#0a5f8f;--green:#24a65a;--green2:#4fc36a;--bg:#f3f6f8;--card:#fff;--line:#d8e1e7;--text:#17202a;--muted:#667582;--danger:#b42318;--gold:#d5a800}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}img{max-width:100%}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#063b59,#075d85);color:white;padding:calc(10px + env(safe-area-inset-top)) 14px 11px;box-shadow:0 2px 12px #0002}
.head{max-width:980px;margin:auto;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px}
.headcentre{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}.crestTiny{width:38px;height:38px;object-fit:contain}
.head h1{font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{border:0;background:none;color:#fff;font-size:24px}
main{max-width:980px;margin:auto;padding:14px 14px 102px}
.hero{background:linear-gradient(135deg,#063b59,#0a6b98);border-radius:20px;color:#fff;padding:18px;display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;box-shadow:0 8px 24px #063b5924;margin-bottom:12px}
.hero img{width:82px;height:82px;object-fit:contain}.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.88;font-size:13px}
.program{background:linear-gradient(135deg,#39aa5a,#23904b);color:#fff;border-radius:15px;padding:13px;text-align:center;margin-bottom:12px;font-weight:800}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:750;color:#33404a}.nav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.weekbar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;margin-bottom:12px}
.weekbar>button{height:42px;border:1px solid var(--line);border-radius:10px;background:#f8fafb;font-size:22px;color:var(--navy)}.weekcentre{text-align:center}.weekcentre b{display:block}.weekcentre span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.today{border:0;background:none;color:#1f6f8b;font-size:12px;font-weight:800;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card,.panel,.progress{background:#fff;border:1px solid #e3e9ed;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000008}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:92px}.metric small{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.03em;margin-bottom:4px}.metric b{font-size:20px;display:block}.metric span{font-size:11px;color:var(--muted)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;background:#dceff7;border-radius:9px;padding:9px 11px;font-weight:800;color:#17445b;margin-bottom:8px}.sectionTitle button,.edit{border:0;background:#edf3f6;border-radius:8px;padding:7px}
.exercise{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fff}.row{display:flex;gap:8px;align-items:center}.code{background:var(--navy);color:#fff;border-radius:6px;padding:6px 8px;font-weight:800}.ename{font-weight:800;flex:1;border:0;background:none;text-align:left;color:var(--text);padding:0}.rx{font-size:13px;color:var(--muted);margin:7px 0}
.previous{background:#f6fafc;border:1px solid #dbe8ee;border-radius:9px;padding:8px 9px;font-size:12px;color:#47616f;margin-bottom:9px}
.sethead,.setrow{display:grid;grid-template-columns:48px 1fr 1fr 34px;gap:7px;align-items:center}.sethead{font-size:10px;color:var(--muted);font-weight:750;padding-bottom:4px}.setrow{margin:6px 0}.setrow input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 8px;font-size:16px}.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.note{background:#edf6fc;border:1px solid #b9d9ec;border-radius:12px;padding:11px;margin:12px 0;font-size:13px}
.phead{display:flex;justify-content:space-between;font-weight:800}.bar{height:11px;background:#e1e6ea;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:var(--green);width:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:10px 12px;font-weight:750;flex:1}.primary{background:var(--navy);color:#fff}.green{background:var(--green);border-color:var(--green);color:#fff}.danger{border-color:#efc0bd;color:var(--danger)}
.add{border:1px dashed #8da2ad;background:#f9fbfc;width:100%;border-radius:10px;padding:10px;color:var(--navy);font-weight:750;margin-top:7px}
.setting{border-top:1px solid var(--line);padding:12px 0}.setting:first-child{border-top:0}.setting label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.setting input,.setting textarea,.setting select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.historylink{border:0;background:none;padding:0;color:var(--navy);font-weight:800;text-align:left}.historytable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.historytable th,.historytable td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}.historytable th{color:var(--muted);font-size:11px}
.pb{display:inline-block;background:#fff4ce;border:1px solid #efd572;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:800;margin-left:5px}.activeinj{display:inline-block;background:#ffe7e5;border:1px solid #f1b4ae;color:#8e1e16;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.listrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.listrow:first-child{border-top:0}.listrow small{color:var(--muted)}.muted{color:var(--muted);font-size:12px}
.chartwrap{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfd;margin-top:9px}svg{width:100%;height:190px;display:block}.chartlabel{font-size:10px;fill:#667582}
.targetbar{height:9px;background:#e4e9ec;border-radius:99px;overflow:hidden;margin-top:6px}.targetbar i{display:block;height:100%;background:var(--green)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:40}.tab{border:0;background:none;color:#7a848d;font-size:9px;min-width:19%;padding:2px}.tab span{display:block;font-size:20px}.tab.active{color:var(--navy);font-weight:800}
.modal{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:flex-end;justify-content:center}.modalbox{background:#fff;border-radius:18px 18px 0 0;padding:17px;width:100%;max-width:760px;max-height:91vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:#eee;border-radius:50%;width:35px;height:35px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#17202a;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:80;font-size:13px;max-width:90%;text-align:center}
.homeActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.homeActions button{padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--navy)}
@media(min-width:720px){.grid2{grid-template-columns:repeat(4,1fr)}.hero{grid-template-columns:100px 1fr}.hero img{width:96px;height:96px}}
</style>
</head>

function monday(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function fmtLong(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function label(d){let a=monday(new Date()),diff=Math.round((d-a)/604800000);return diff===0?"This Week":diff===-1?"Last Week":diff===1?"Next Week":"Week of "+fmt(d)}
function rk(p,w,s,i,set,k){return `mgt_${p}_${w}_${s}_${i}_${set}_${k}`}
function saveData(){localStorage.setItem("mgt_data",JSON.stringify(data))}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function showTab(t){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));let el=document.getElementById("t"+t[0].toUpperCase()+t.slice(1));if(el)el.classList.add("active");render()}
function selectProgram(i){program=i;localStorage.setItem("mgt_program",i);render()}
function shiftWeek(n){weekStart=addDays(weekStart,n*7);render();window.scrollTo({top:0,behavior:"smooth"})}
function goToday(){weekStart=monday(new Date());render()}
function weekbar(){return `<div class="weekbar"><button onclick="shiftWeek(-1)">‹</button><div class="weekcentre"><b>${label(weekStart)}</b><span>${fmt(weekStart)} – ${fmt(addDays(weekStart,6))}</span><button class="today" onclick="goToday()">Jump to this week</button></div><button onclick="shiftWeek(1)">›</button></div>`}
function render(){
  if(program>=data.programs.length)program=0;
  document.getElementById("appTitle").textContent=data.appTitle;
  document.getElementById("programNav").innerHTML=data.programs.map((p,i)=>`<button class="${i===program?'active':''}" onclick="selectProgram(${i})">${esc(p.name)}</button>`).join("");
  if(tab==="home")home(); if(tab==="workouts")workouts(); if(tab==="progress")progress(); if(tab==="notes")notes(); if(tab==="settings")settings();
}

function calcSetStats(pi,w,si,ei){
  let e=data.programs[pi].sections[si].items[ei],sets=Math.max(1,Number(e[2])||1),volume=0,bestWeight=0,bestReps=0,bestE1RM=0,completed=0;
  for(let s=0;s<sets;s++){let wt=parseFloat(localStorage.getItem(rk(pi,w,si,ei,s,"weight")))||0,rp=parseFloat(localStorage.getItem(rk(pi,w,si,ei,s,"reps")))||0;if(wt>0&&rp>0){volume+=wt*rp;if(wt>bestWeight){bestWeight=wt;bestReps=rp}let e1=rp<=12?wt*(1+rp/30):0;if(e1>bestE1RM)bestE1RM=e1}if(localStorage.getItem(rk(pi,w,si,ei,s,"done"))==="1")completed++}
  return {volume,bestWeight,bestReps,bestE1RM,completed,sets};
}
function weekVolume(pi,w){let total=0,p=data.programs[pi];p.sections.forEach((sec,si)=>sec.items.forEach((e,ei)=>total+=calcSetStats(pi,w,si,ei).volume));return total}
function allTimeVolume(){let sum=0,seen=new Set();Object.keys(localStorage).forEach(k=>{let m=k.match(/^mgt_(\d+)_(\d{4}-\d{2}-\d{2})_/);if(m)seen.add(m[1]+"|"+m[2])});seen.forEach(x=>{let [pi,w]=x.split("|");if(data.programs[Number(pi)])sum+=weekVolume(Number(pi),w)});return sum}
function bestEverForExercise(pi,si,ei,excludeCurrentKey=""){
  let prefix=`mgt_${pi}_`,bestWeight=0,bestE1RM=0,bestVolume=0,bestDate="",weeks=new Set();
  Object.keys(localStorage).forEach(k=>{if(k.startsWith(prefix)&&k.endsWith("_weight")){let m=k.match(/^mgt_\d+_(\d{4}-\d{2}-\d{2})_/);if(m)weeks.add(m[1])}});
  weeks.forEach(w=>{let st=calcSetStats(pi,w,si,ei);if(st.bestWeight>bestWeight){bestWeight=st.bestWeight;bestDate=w}if(st.bestE1RM>bestE1RM)bestE1RM=st.bestE1RM;if(st.volume>bestVolume)bestVolume=st.volume});
  return {bestWeight,bestE1RM,bestVolume,bestDate};
}
function setHistory(pi,si,ei,weeksBack=16){
  let arr=[];for(let n=weeksBack-1;n>=0;n--){let d=addDays(monday(new Date()),-7*n),w=iso(d),st=calcSetStats(pi,w,si,ei);if(st.volume||st.bestWeight||st.completed)arr.push({date:fmt(d),iso:w,weight:st.bestWeight,e1rm:st.bestE1RM,volume:st.volume})}return arr;
}
function bodyweightHistory(weeksBack=20){let arr=[];for(let n=weeksBack-1;n>=0;n--){let d=addDays(monday(new Date()),-7*n),w=iso(d),v=parseFloat(localStorage.getItem("mgt_bw_"+w));if(v)arr.push({date:fmt(d),value:v})}return arr}
function svgLine(points,key,suffix=""){
  if(!points.length)return `<div class="muted">No data yet.</div>`;
  let vals=points.map(x=>Number(x[key])||0).filter(v=>v>0);if(!vals.length)return `<div class="muted">No data yet.</div>`;
  let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min*=0.95;max*=1.05}let W=340,H=170,pad=28;
  let coords=points.map((p,i)=>{let v=Number(p[key])||0,x=pad+(i*(W-pad*2)/Math.max(1,points.length-1)),y=H-pad-((v-min)/(max-min||1))*(H-pad*2);return [x,y,v]}).filter(x=>x[2]>0);
  let line=coords.map((c,i)=>(i?"L":"M")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  let dots=coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="#0a5f8f"/>`).join("");
  let labels=points.map((p,i)=>i===0||i===points.length-1?`<text class="chartlabel" x="${pad+(i*(W-pad*2)/Math.max(1,points.length-1))}" y="${H-5}" text-anchor="${i===0?'start':'end'}">${esc(p.date)}</text>`:"").join("");
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#d8e1e7"/><path d="${line}" fill="none" stroke="#0a5f8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}<text class="chartlabel" x="4" y="${pad}">${max.toFixed(1)}${suffix}</text><text class="chartlabel" x="4" y="${H-pad}">${min.toFixed(1)}${suffix}</text></svg></div>`;
}

function maybePB(si,ei,s){
  let w=iso(weekStart),e=data.programs[program].sections[si].items[ei],wt=parseFloat(localStorage.getItem(rk(program,w,si,ei,s,"weight")))||0,rp=parseFloat(localStorage.getItem(rk(program,w,si,ei,s,"reps")))||0;
  if(!wt||!rp)return;
  let currentE1=rp<=12?wt*(1+rp/30):0,prevBest=0,prevWeight=0;
  for(let n=1;n<=30;n++){let ww=iso(addDays(weekStart,-7*n)),st=calcSetStats(program,ww,si,ei);prevBest=Math.max(prevBest,st.bestE1RM);prevWeight=Math.max(prevWeight,st.bestWeight)}

}

function openModal(h){document.getElementById("modalbox").innerHTML=h;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function editSection(si){let s=data.programs[program].sections[si];openModal(`<div class="modalhead"><h2>Edit section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="m1" value="${esc(s.name)}"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections[${si}].name=document.getElementById('m1').value;saveData();closeModal();render()">Save</button>`)}
function addSection(){openModal(`<div class="modalhead"><h2>Add section</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Name</label><input id="m1"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections.push({name:document.getElementById('m1').value||'New Section',items:[]});saveData();closeModal();render()">Add</button>`)}
function editExercise(si,ei){let e=data.programs[program].sections[si].items[ei];openModal(`<div class="modalhead"><h2>Edit exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="e0" value="${esc(e[0])}"></div><div class="field"><label>Name</label><input id="e1" value="${esc(e[1])}"></div><div class="field"><label>Sets</label><input id="e2" type="number" min="1" value="${esc(e[2])}"></div><div class="field"><label>Target reps</label><input id="e3" value="${esc(e[3])}"></div><div class="field"><label>Extra</label><input id="e4" value="${esc(e[4]||"")}"></div><button class="btn primary" style="width:100%" onclick="saveExercise(${si},${ei})">Save</button>`)}
function saveExercise(si,ei){let e=data.programs[program].sections[si].items[ei];e[0]=document.getElementById("e0").value;e[1]=document.getElementById("e1").value;e[2]=Math.max(1,Number(document.getElementById("e2").value)||1);e[3]=document.getElementById("e3").value;e[4]=document.getElementById("e4").value;saveData();closeModal();render()}
function addExercise(si){openModal(`<div class="modalhead"><h2>Add exercise</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Code</label><input id="e0" value="NEW"></div><div class="field"><label>Name</label><input id="e1"></div><div class="field"><label>Sets</label><input id="e2" type="number" min="1" value="3"></div><div class="field"><label>Target reps</label><input id="e3" value="8"></div><button class="btn primary" style="width:100%" onclick="data.programs[program].sections[${si}].items.push([document.getElementById('e0').value,document.getElementById('e1').value||'Exercise',Math.max(1,Number(document.getElementById('e2').value)||1),document.getElementById('e3').value,'']);saveData();closeModal();render()">Add</button>`)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1700)}

render();
</script>
</body>
